[build]
  publish = "public"
  functions = "netlify/functions"

# ---------------------------------------------------------------- API
[[redirects]]
  from = "/api/gerar"
  to = "/.netlify/functions/gerar"
  status = 200

[[redirects]]
  from = "/api/ler"
  to = "/.netlify/functions/ler"
  status = 200

# ---------------------------------------------------------------- URL canônica: só "/" (sem /index.html)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Se um dia você usar domínio próprio (ex.: www.seudominio.com.br), defina o domínio principal em
# Netlify > Domain management: o Netlify já redireciona os demais (inclusive http para https) com 301.
# O HTTPS é obrigatório: o Netlify redireciona http para https e o HSTS abaixo mantém o navegador em https.

# ---------------------------------------------------------------- Cabeçalhos de segurança (todas as páginas)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# ---------------------------------------------------------------- Cache (carregamento mais rápido nas próximas visitas)
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
